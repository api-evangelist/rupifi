name: Rupifi
description: 'Rupifi is an India-based B2B payments and embedded-credit fintech that lets marketplaces,
  distributors, and brands offer their SME and retailer buyers a line of credit and Buy Now, Pay Later
  (BNPL) at checkout, with flexible 15/30/45/60/90-day repayment terms. Its platform connects three parties
  — anchors (brands/platforms), merchants (borrowers/retailers), and lenders — through digital onboarding,
  real-time credit assessment, and embedded B2B checkout. Products include B2B Credit (line of credit)
  and B2B Checkout, integrated by partners via the Rupifi developer portal and BNPL API.'
